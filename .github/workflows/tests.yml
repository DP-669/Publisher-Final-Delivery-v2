name: tests

# These tests exist because the previous suite rotted silently: it kept passing
# as scripts with no assertions while the code moved on underneath it. Running
# on every push is what keeps that from happening again.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # No API keys and no network: every external call is mocked.
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Check every module imports
        run: python -c "import engine, prompts, models, feedback, persistence, dropbox_pipeline"

      - name: Check the Streamlit entrypoint compiles
        run: python -m py_compile app.py
